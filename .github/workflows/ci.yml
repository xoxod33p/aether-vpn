name: Continuous Integration

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      AETHER_CLOUD_API_URL: ${{ secrets.AETHER_CLOUD_API_URL }}
      AETHER_CLOUD_API_KEY: ${{ secrets.AETHER_CLOUD_API_KEY }}
      VITE_CLOUD_API_URL: ${{ secrets.AETHER_CLOUD_API_URL }}
      VITE_CLOUD_API_KEY: ${{ secrets.AETHER_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm run build
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml
