name: Release Automation & Cross-Platform CI

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Target Release Version
        id: calc
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $localVer = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Write-Host "Local version: $localVer"
          
          $latestTag = ""
          try {
            $latest = gh release list --limit 5 --json tagName,isDraft,isPrerelease --jq 'map(select(.isDraft != true and .isPrerelease != true))[0].tagName' 2>$null
            if ($latest) { $latestTag = $latest.Trim().TrimStart('v') }
          } catch {}

          Write-Host "Latest published release on GitHub: $latestTag"

          $finalVer = $localVer
          if ($latestTag) {
            $lp = $localVer.Split('.') | ForEach-Object { [int]$_ }
            $gp = $latestTag.Split('.') | ForEach-Object { [int]$_ }
            while ($lp.Count -lt 3) { $lp += 0 }
            while ($gp.Count -lt 3) { $gp += 0 }

            $isGreater = $false
            for ($i = 0; $i -lt 3; $i++) {
              if ($lp[$i] -gt $gp[$i]) {
                $isGreater = $true
                break
              } elseif ($lp[$i] -lt $gp[$i]) {
                break
              }
            }

            if (-not $isGreater) {
              $nextPatch = $gp[2] + 1
              $finalVer = "$($gp[0]).$($gp[1]).$nextPatch"
              Write-Host "Local version ($localVer) <= latest release ($latestTag). Auto-bumping to: $finalVer"
            }
          }

          Write-Host "Target build version: $finalVer"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$finalVer"

  build-tauri:
    needs: resolve-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Environment Secrets & Defaults
        shell: pwsh
        run: |
          $apiUrl = "${{ secrets.AETHER_CLOUD_API_URL || secrets.VITE_CLOUD_API_URL }}"
          if ([string]::IsNullOrWhiteSpace($apiUrl)) {
            $apiUrl = "https://aether-backend-drab.vercel.app/api/configs"
          }
          $apiKey = "${{ secrets.AETHER_CLOUD_API_KEY || secrets.VITE_CLOUD_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            $apiKey = "aether_sync_super_secret_key_123"
          }

          $envContent = "AETHER_CLOUD_API_URL=$apiUrl`nAETHER_CLOUD_API_KEY=$apiKey`nVITE_CLOUD_API_URL=$apiUrl`nVITE_CLOUD_API_KEY=$apiKey`n"
          Set-Content -Path ".env" -Value $envContent -Encoding UTF8
          Set-Content -Path "src-tauri/.env" -Value $envContent -Encoding UTF8

          "AETHER_CLOUD_API_URL=$apiUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "AETHER_CLOUD_API_KEY=$apiKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "VITE_CLOUD_API_URL=$apiUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "VITE_CLOUD_API_KEY=$apiKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          Write-Host "Configured environment secrets and generated .env files."

      - name: Apply Resolved Release Version
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          Write-Host "Configuring build for version: $ver"
          
          $tPath = (Resolve-Path "src-tauri/tauri.conf.json").Path
          $tRaw = Get-Content $tPath -Raw
          $tRaw = $tRaw -replace '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`""
          Set-Content -Path $tPath -Value $tRaw -NoNewline

          $pPath = (Resolve-Path "package.json").Path
          $pRaw = Get-Content $pPath -Raw
          $pRaw = $pRaw -replace '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`""
          Set-Content -Path $pPath -Value $pRaw -NoNewline

          $cPath = (Resolve-Path "src-tauri/Cargo.toml").Path
          $lines = Get-Content $cPath
          for ($idx = 0; $idx -lt $lines.Length; $idx++) {
            if ($lines[$idx] -match '^version\s*=') {
              $lines[$idx] = "version = `"$ver`""
              break
            }
          }
          $lines | Set-Content -Path $cPath

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Download sing-box core (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $binDir = "src-tauri/bin"
          New-Item -ItemType Directory -Force -Path $binDir
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip" -OutFile "$binDir/sing-box.zip"
          Expand-Archive -Path "$binDir/sing-box.zip" -DestinationPath "$binDir/extracted"
          Get-ChildItem -Path "$binDir/extracted" -Recurse -Filter "sing-box.exe" | ForEach-Object { Move-Item $_.FullName "$binDir/sing-box.exe" -Force }
          Remove-Item -Recurse -Force "$binDir/sing-box.zip", "$binDir/extracted"

      - name: Download sing-box core (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/bin
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz" -o src-tauri/bin/sing-box.tar.gz
          tar -xzf src-tauri/bin/sing-box.tar.gz -C src-tauri/bin
          find src-tauri/bin -name sing-box -type f -exec mv {} src-tauri/bin/sing-box \;
          chmod +x src-tauri/bin/sing-box
          rm -rf src-tauri/bin/sing-box.tar.gz src-tauri/bin/sing-box-1.11.4-*

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Run Backend Rust Test Suite
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Prepare Release Asset Overwrite
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$ver"
          if ($env:RUNNER_OS -eq "Windows") {
            gh release delete-asset $tag "AetherVPN_${ver}_x64-setup.exe" -y 2>$null
          } else {
            gh release delete-asset $tag "AetherVPN_${ver}_amd64.deb" -y 2>$null
          }

      - name: Build Tauri Application Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AETHER_CLOUD_API_URL: ${{ env.AETHER_CLOUD_API_URL }}
          AETHER_CLOUD_API_KEY: ${{ env.AETHER_CLOUD_API_KEY }}
          VITE_CLOUD_API_URL: ${{ env.VITE_CLOUD_API_URL }}
          VITE_CLOUD_API_KEY: ${{ env.VITE_CLOUD_API_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'AetherVPN v__VERSION__'
          releaseBody: 'Production release of AetherVPN modern cross-platform VPN client.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Portable Windows Release
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable-dist"
          if (Test-Path "src-tauri/target/release/aether-vpn.exe") {
            Copy-Item "src-tauri/target/release/aether-vpn.exe" "portable-dist/aether-vpn-portable.exe"
            Copy-Item "src-tauri/bin/sing-box.exe" "portable-dist/sing-box.exe"
            Compress-Archive -Path "portable-dist/*" -DestinationPath "aether-vpn-portable-windows-x64.zip" -Force
          }

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            aether-vpn-portable-windows-x64.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore

      - name: Upload Bundles to Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$ver"
          if ($env:RUNNER_OS -eq "Windows") {
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
              gh release upload $tag $_.FullName --clobber
            }
            if (Test-Path "aether-vpn-portable-windows-x64.zip") {
              gh release upload $tag aether-vpn-portable-windows-x64.zip --clobber
            }
          } else {
            Get-ChildItem -Path "src-tauri/target/release/bundle/deb/*.deb" -ErrorAction SilentlyContinue | ForEach-Object {
              gh release upload $tag $_.FullName --clobber
            }
          }

  build-android:
    needs: [resolve-version, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Inject Environment Secrets & Defaults
        shell: pwsh
        run: |
          $apiUrl = "${{ secrets.AETHER_CLOUD_API_URL || secrets.VITE_CLOUD_API_URL }}"
          if ([string]::IsNullOrWhiteSpace($apiUrl)) {
            $apiUrl = "https://aether-backend-drab.vercel.app/api/configs"
          }
          $apiKey = "${{ secrets.AETHER_CLOUD_API_KEY || secrets.VITE_CLOUD_API_KEY }}"
          if ([string]::IsNullOrWhiteSpace($apiKey)) {
            $apiKey = "aether_sync_super_secret_key_123"
          }

          $envContent = "AETHER_CLOUD_API_URL=$apiUrl`nAETHER_CLOUD_API_KEY=$apiKey`nVITE_CLOUD_API_URL=$apiUrl`nVITE_CLOUD_API_KEY=$apiKey`n"
          Set-Content -Path ".env" -Value $envContent -Encoding UTF8
          Set-Content -Path "src-tauri/.env" -Value $envContent -Encoding UTF8

          "AETHER_CLOUD_API_URL=$apiUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "AETHER_CLOUD_API_KEY=$apiKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "VITE_CLOUD_API_URL=$apiUrl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "VITE_CLOUD_API_KEY=$apiKey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8

      - name: Apply Resolved Release Version
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          Write-Host "Configuring build for version: $ver"
          
          $tPath = (Resolve-Path "src-tauri/tauri.conf.json").Path
          $tRaw = Get-Content $tPath -Raw
          $tRaw = $tRaw -replace '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`""
          Set-Content -Path $tPath -Value $tRaw -NoNewline

          $pPath = (Resolve-Path "package.json").Path
          $pRaw = Get-Content $pPath -Raw
          $pRaw = $pRaw -replace '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`""
          Set-Content -Path $pPath -Value $pRaw -NoNewline

          $cPath = (Resolve-Path "src-tauri/Cargo.toml").Path
          $lines = Get-Content $cPath
          for ($idx = 0; $idx -lt $lines.Length; $idx++) {
            if ($lines[$idx] -match '^version\s*=') {
              $lines[$idx] = "version = `"$ver`""
              break
            }
          }
          $lines | Set-Content -Path $cPath

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Initialize Android Target
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Build Android APK
        run: |
          npx tauri android build --apk --target aarch64 --ci

      - name: Sign Android APK
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          keytool -genkeypair -v -keystore release.keystore -alias aethervpn -keyalg RSA -keysize 2048 -validity 10000 -storepass aethervpnpass -keypass aethervpnpass -dname "CN=AetherVPN, OU=Release, O=AetherVPN, L=Global, S=Global, C=US"
          
          $buildToolsDir = Get-ChildItem "$env:ANDROID_HOME/build-tools" | Sort-Object Name -Descending | Select-Object -First 1
          $apksigner = "$($buildToolsDir.FullName)/apksigner"
          chmod +x $apksigner 2>$null
          
          New-Item -ItemType Directory -Force -Path "android-release"
          $apks = Get-ChildItem -Path "src-tauri/gen/android" -Recurse -Filter "*.apk" | Where-Object { $_.Name -like "*release*" }
          if (-not $apks) {
            $apks = Get-ChildItem -Path "src-tauri/gen/android" -Recurse -Filter "*.apk"
          }
          
          foreach ($apk in $apks) {
            $signedName = "AetherVPN_${ver}_arm64.apk"
            $outApk = "android-release/$signedName"
            try {
              & $apksigner sign --ks release.keystore --ks-pass pass:aethervpnpass --key-pass pass:aethervpnpass --out $outApk $apk.FullName
              Write-Host "Signed APK created at: $outApk"
            } catch {
              Write-Host "Signing warning: $_. Copying raw APK."
              Copy-Item $apk.FullName $outApk -Force
            }
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-android-apk
          path: android-release/*.apk
          if-no-files-found: ignore

      - name: Upload Android APK to GitHub Release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ needs.resolve-version.outputs.version }}"
          $tag = "v$ver"
          $apks = Get-ChildItem -Path "android-release" -Filter "*.apk"
          foreach ($apk in $apks) {
            Write-Host "Uploading to Release ${tag}: $($apk.Name)"
            gh release upload $tag $apk.FullName --clobber
          }
