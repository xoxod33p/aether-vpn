[package]
name = "aether-vpn"
version = "0.1.1"
description = "Modern Cross-Platform VPN Client in Rust"
authors = ["AetherVPN Team"]
license = "MIT"
repository = "https://github.com/aethervpn/aethervpn"
edition = "2024"
rust-version = "1.90"

[lib]
name = "aether_vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["custom-protocol", "image-png", "image-ico", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2.0"
parking_lot = "0.12"
fastrand = "2.3"
dirs = "7.0"
regex = "1"
base64 = "0.22"
url = "2.5"
serde_yaml = "0.9"
